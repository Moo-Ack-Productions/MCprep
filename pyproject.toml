[tool.poetry]
name = "MCprep"
version = "3.5"
description = "Blender python addon to increase workflow for creating minecraft renders and animations"
authors = ["TheDuckCow"]
license = "GPL-3.0-only"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
flake8 = "^5.0.4"
bpy-addon-build = ">=0.5.0,<0.6.0"
polib = "^1.2.0"
bpy = ">=4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
